<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="Scenario 3 hybrid cloud architecture">
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="600" y="34" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1f2a44">Scenario 3: Hybrid Cloud Solution for Legacy Applications</text>
  <text x="600" y="56" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5b6b86">Applications in AWS (High Availability) with On-Premises Database</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="48" y="92" font-size="12" fill="#3d4f6f">Users</text>
    <rect x="40" y="104" width="70" height="36" rx="8" fill="#5b3fd6"/>
    <text x="75" y="126" text-anchor="middle" font-size="11" fill="#fff">Route 53</text>
    <rect x="40" y="150" width="70" height="36" rx="8" fill="#4b2fb3"/>
    <text x="75" y="172" text-anchor="middle" font-size="11" fill="#fff">AWS WAF</text>
    <rect x="140" y="80" width="700" height="430" rx="16" fill="#f4f8ff" stroke="#7ea2e0"/>
    <text x="160" y="106" font-size="14" font-weight="700" fill="#1f2a44">AWS Cloud — VPC 10.0.0.0/16</text>
    <rect x="300" y="92" width="220" height="40" rx="8" fill="#5b3fd6"/>
    <text x="410" y="116" text-anchor="middle" font-size="12" fill="#fff">Application Load Balancer</text>
    <rect x="160" y="150" width="320" height="330" rx="12" fill="#fff" stroke="#9bb6e3" stroke-dasharray="5 3"/>
    <text x="176" y="174" font-size="12" font-weight="700" fill="#35507a">AZ 1 (ap-south-1a)</text>
    <rect x="176" y="190" width="288" height="120" rx="10" fill="#f7fff8" stroke="#8fbf8f"/>
    <text x="190" y="212" font-size="11" fill="#2f6f3e">Public subnet — Auto Scaling / EC2</text>
    <rect x="196" y="228" width="70" height="56" rx="8" fill="#fff" stroke="#f0a030"/>
    <rect x="280" y="228" width="70" height="56" rx="8" fill="#fff" stroke="#f0a030"/>
    <rect x="364" y="228" width="70" height="56" rx="8" fill="#fff" stroke="#f0a030"/>
    <text x="320" y="300" text-anchor="middle" font-size="11" fill="#c36b00">Application servers</text>
    <rect x="176" y="330" width="288" height="130" rx="10" fill="#f7fbff" stroke="#9bb6e3"/>
    <text x="190" y="354" font-size="11" fill="#35507a">Private subnet</text>
    <text x="190" y="378" font-size="11" fill="#1f2a44">ElastiCache · S3 · CloudWatch</text>
    <text x="190" y="400" font-size="11" fill="#1f2a44">Logs, assets, optional cache</text>
    <rect x="500" y="150" width="320" height="330" rx="12" fill="#fff" stroke="#9bb6e3" stroke-dasharray="5 3"/>
    <text x="516" y="174" font-size="12" font-weight="700" fill="#35507a">AZ 2 (ap-south-1b)</text>
    <rect x="516" y="190" width="288" height="120" rx="10" fill="#f7fff8" stroke="#8fbf8f"/>
    <text x="530" y="212" font-size="11" fill="#2f6f3e">Public subnet — Auto Scaling / EC2</text>
    <rect x="536" y="228" width="70" height="56" rx="8" fill="#fff" stroke="#f0a030"/>
    <rect x="620" y="228" width="70" height="56" rx="8" fill="#fff" stroke="#f0a030"/>
    <rect x="704" y="228" width="70" height="56" rx="8" fill="#fff" stroke="#f0a030"/>
    <text x="660" y="300" text-anchor="middle" font-size="11" fill="#c36b00">Application servers</text>
    <rect x="516" y="330" width="288" height="130" rx="10" fill="#f7fbff" stroke="#9bb6e3"/>
    <text x="530" y="354" font-size="11" fill="#35507a">Private subnet</text>
    <text x="530" y="378" font-size="11" fill="#1f2a44">Systems Manager · EBS · Backup</text>
    <text x="530" y="400" font-size="11" fill="#1f2a44">Encrypted volumes and backups</text>
    <rect x="870" y="80" width="300" height="430" rx="16" fill="#f7f8fb" stroke="#9aa7c2"/>
    <text x="888" y="106" font-size="14" font-weight="700" fill="#1f2a44">Corporate data center</text>
    <rect x="890" y="124" width="260" height="44" rx="8" fill="#fff" stroke="#c45c5c"/>
    <text x="1020" y="150" text-anchor="middle" font-size="12" fill="#a33">On-prem firewall</text>
    <rect x="890" y="184" width="260" height="160" rx="10" fill="#fff" stroke="#7ea2e0"/>
    <text x="1020" y="210" text-anchor="middle" font-size="12" font-weight="700" fill="#35507a">Database tier (HA)</text>
    <rect x="910" y="228" width="100" height="86" rx="8" fill="#f4f8ff" stroke="#7ea2e0"/>
    <text x="960" y="268" text-anchor="middle" font-size="11" fill="#1f2a44">Primary DB</text>
    <rect x="1030" y="228" width="100" height="86" rx="8" fill="#f4f8ff" stroke="#7ea2e0"/>
    <text x="1080" y="268" text-anchor="middle" font-size="11" fill="#1f2a44">Replica DB</text>
    <rect x="890" y="360" width="260" height="120" rx="10" fill="#fff" stroke="#9aa7c2"/>
    <text x="1020" y="388" text-anchor="middle" font-size="12" fill="#1f2a44">Local storage / backup</text>
    <text x="1020" y="412" text-anchor="middle" font-size="11" fill="#5b6b86">On-prem retention</text>
    <path d="M110 122 H140" stroke="#3d4f6f" stroke-width="2"/>
    <path d="M410 132 V150" stroke="#3d4f6f" stroke-width="2"/>
    <path d="M840 320 H870" stroke="#3d4f6f" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="855" y="308" text-anchor="middle" font-size="10" fill="#35507a">VPN / Direct Connect</text>
    <rect x="40" y="530" width="560" height="170" rx="12" fill="#f3faf4" stroke="#b7ddc0"/>
    <text x="58" y="556" font-size="14" font-weight="700" fill="#2f6f3e">Security & encryption</text>
    <text x="58" y="582" font-size="12" fill="#1f2a44">Security Groups · IAM · ACM · KMS · Encrypted data</text>
    <text x="58" y="606" font-size="12" fill="#1f2a44">TLS in transit, encryption at rest, least privilege</text>
    <text x="58" y="630" font-size="12" fill="#1f2a44">WAF at the edge; private DB path over VPN/DX</text>
    <rect x="620" y="530" width="540" height="170" rx="12" fill="#f4f8ff" stroke="#c5d4ee"/>
    <text x="638" y="556" font-size="14" font-weight="700" fill="#35507a">Management & monitoring</text>
    <text x="638" y="582" font-size="12" fill="#1f2a44">CloudWatch · CloudTrail · AWS Config · GuardDuty</text>
    <text x="638" y="606" font-size="12" fill="#1f2a44">Metrics, audit logs, compliance, threat detection</text>
    <text x="638" y="630" font-size="12" fill="#1f2a44">No single point of failure across AZs and the hybrid link</text>
  </g>
</svg>
